[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [".pytest_cache", "__pycache__", "node_modules"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "skip"
warn_unused_configs = true
