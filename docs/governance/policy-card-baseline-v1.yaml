display_name: M1 synthetic/dev baseline policy
purpose: 为无账号的 Architecture MVP 提供可审计、可复核且不产生真实平台副作用的默认 Policy。
owner_role: governance_owner
reviewer_roles: [policy_reviewer, data_protection_owner]
evidence_refs:
