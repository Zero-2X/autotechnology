    captured_at: '2026-09-16T00:00:00+08:00'
rules:
  - rule_id: account_unknown
    requirement: 账号缺失或授权状态未知时只能使用 manual_export 或 simulation，不得伪造 healthy 或 authorized_api。
    on_unknown: manual_review
  - rule_id: architecture_mvp_distribution
    requirement: Architecture MVP 只允许 manual_export 和 simulation；两者均不得发起 HTTP 平台请求。
    on_unknown: deny
  - rule_id: unknown_external_result
    requirement: 外部结果未知时暂停相关副作用并创建人工核查，禁止自动重发。
    on_unknown: manual_review
  - rule_id: policy_expiry
    requirement: review_due_at 到期后切换到人工模式，阻止新的副作用任务并要求创建新 Policy 版本。
    on_unknown: deny
allowed_release_levels: [architecture_mvp]
synthetic_only: true
effective_at: '2026-09-16T00:00:00+08:00'
review_due_at: '2026-10-16T00:00:00+08:00'
locked_by: team/governance
