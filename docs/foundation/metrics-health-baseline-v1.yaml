baseline_key: metrics-health
baseline_version: 1
status: active
health:
  liveness_path: /health/live
  readiness_path: /health/ready
  default_checks: [database]
  dependency_probe_default: no_network
  statuses: [ready, configured, degraded, unavailable, invalid_configuration, not_configured]
metrics:
  path: /metrics
  format: prometheus-0.0.4
  scopes: [technical, business]
  kinds: [counter, gauge, histogram]
  max_label_value_length: 128
  default_metrics:
    - http_requests_total
    - http_request_duration_seconds
    - dependency_ready
    - business_events_total
security:
  tenant_labels: false
  correlation_labels: false
  payload_labels: false
  credential_labels: false
  external_export: false
fixture:
  process_local: true
  network_access: false
  persistence: false
effective_at: '2026-09-16T00:00:00+08:00'
locked_by: team/foundation
