services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set a local-only value}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set a local-only value}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
