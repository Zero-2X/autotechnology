services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ai_content_workflow
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_content_workflow"]
      interval: 5s
      timeout: 3s
      retries: 5
